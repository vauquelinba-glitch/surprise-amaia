<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pour Amaïa ❤️</title>

<style>
:root{
  --bg:#0e0e14;
  --card:#191922;
  --muted:#b9b9c6;
}
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at top,#28131d,#0e0e14 55%);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

.app{width:min(100%,520px)}

.card{
  background:rgba(25,25,34,.95);
  border:1px solid #ffffff14;
  border-radius:28px;
  padding:25px;
  box-shadow:0 20px 70px #0008;
}

.eyebrow{
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}

.progress{
  height:8px;
  background:#2a2a34;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:22px;
}

.bar{
  height:100%;
  background:linear-gradient(90deg,#ff4d7a,#ff8bad);
}

h1{
  font-size:31px;
  line-height:1.1;
  margin:0 0 20px;
}

p{line-height:1.55}
.muted{color:var(--muted)}

.options{
  display:grid;
  gap:12px;
}

.option,.primary{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px 16px;
  font-size:16px;
  font-weight:750;
  cursor:pointer;
}

.option{
  background:#272731;
  color:#fff;
  text-align:left;
  border:1px solid transparent;
}

.option:hover{border-color:#555565}
.option:disabled{opacity:.55}

.primary{
  background:linear-gradient(90deg,#ff4d7a,#ff7198);
  color:white;
  margin-top:8px;
}

.feedback{
  margin-top:18px;
  padding:14px;
  border-radius:16px;
}

.good{
  background:#2ecc711f;
  border:1px solid #2ecc7155;
}

.bad{
  background:#ff5f5f1f;
  border:1px solid #ff5f5f55;
}

.timer{
  font-size:42px;
  font-weight:900;
  text-align:center;
  margin:18px 0;
}

.center{text-align:center}

.big{
  font-size:46px;
  font-weight:950;
  letter-spacing:-.04em;
}

.date{
  font-size:22px;
  font-weight:850;
}

.emoji{
  font-size:36px;
  margin-bottom:10px;
}

.tiny{
  font-size:12px;
  color:#9292a0;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="app">
  <div class="card" id="card"></div>
</div>

<script>

const qs = [

{
q:"Quel était notre premier festival ?",
a:["Tomorrowland","Solidays","Dream Nation","Elektric Park"],
c:2
},

{
q:"Quel est notre prochain festival prévu ?",
a:["Tomorrowland","Dream Nation","FCKNYE","Les Vieilles Charrues"],
c:2,
after:"Bon… c’était juste pour tester si tu savais utiliser le quiz. 😌"
},

{
q:"Au Maroc, Baptiste a préféré ?",
a:["Les paysages","Les tajines","Le pain","La piscine"],
c:2
},

{
q:"Quelle est notre date de mise en couple ?",
a:["14 février","21 juin","Y’a pas de date officielle 😌","1er janvier"],
c:2,
after:"Bon… en fait toutes ces questions ne servaient absolument à rien. Maintenant, on commence vraiment. 👀"
},

{
q:"Lequel de ces pays ne fait PAS partie du Royaume-Uni ?",
a:["Angleterre","Écosse","Irlande","Pays de Galles"],
c:2
},

{
q:"Dans quel pays peut-on voir une limitation à 70 sans parler de 70 km/h ?",
a:["France","Belgique","Royaume-Uni","Allemagne"],
c:2
},

{
q:"Qu’est-ce qu’un Britannique appelle couramment « crisps » ?",
a:["Des frites","Des chips","Des biscuits","Des céréales"],
c:1
},

{
q:"Laquelle de ces affirmations est vraie ?",
a:[
"Big Ben est le nom d’un pont",
"Big Ben est le nom officiel de Londres",
"Big Ben est le surnom de la grande cloche",
"Big Ben est le nom du Parlement"
],
c:2
},

{
q:"Pourquoi Baptiste fait ce quiz ?",
a:[
"Parce qu’il trouvait ça romantique",
"Parce qu’il voulait tester ta culture générale",
"Parce qu’il a oublié de préparer un cadeau pour te l’annoncer 😂",
"Parce qu’il avait beaucoup trop de temps libre"
],
c:2,
after:"Voilà… fallait bien trouver un moyen de gagner du temps 😂"
},

{
q:"Ton cadeau, tu penses que c’est plutôt…",
a:[
"Un objet",
"Un repas",
"Un souvenir à vivre à deux ❤️",
"Une plante"
],
c:2
}

];

let i = Number(localStorage.getItem("amaiaQuestion") || 0);

const card = document.getElementById("card");

let currentOptions = [];


/* MÉLANGE ALÉATOIRE DES RÉPONSES */

function shuffledOptions(x){

  return x.a
    .map((text,index)=>({
      text:text,
      correct:index === x.c
    }))
    .sort(()=>Math.random()-0.5);

}


/* AFFICHAGE QUESTION */

function rq(){

  const x = qs[i];

  currentOptions = shuffledOptions(x);

  card.innerHTML = `

    <div class="eyebrow">
      Question ${i+1} / ${qs.length}
    </div>

    <div class="progress">
      <div class="bar"
      style="width:${((i+1)/qs.length)*100}%">
      </div>
    </div>

    <h1>${x.q}</h1>

    <div class="options">

      ${currentOptions.map((o,j)=>`

        <button
        class="option"
        onclick="ans(${j})">

        ${o.text}

        </button>

      `).join("")}

    </div>

    <div id="fb"></div>

  `;

}


/* RÉPONSE */

function ans(j){

  const x = qs[i];

  const selected = currentOptions[j];

  document
    .querySelectorAll(".option")
    .forEach(b=>b.disabled=true);

  const fb = document.getElementById("fb");


  if(selected.correct){

    fb.innerHTML =
    '<div class="feedback good">Bien joué 😏</div>';

    setTimeout(
      ()=>adv(x),
      650
    );

  }

  else{

    const until = Date.now() + 120000;

    localStorage.setItem(
      "amaiaPenaltyUntil",
      until
    );

    fb.innerHTML = `

      <div class="feedback bad">

        Raté 😈

        <br>

        La bonne réponse était :

        <strong>
        ${x.a[x.c]}
        </strong>

        <br><br>

        2 minutes de pénalité avant la suite.

      </div>

      <div
      class="timer"
      id="timer">
      </div>

    `;

    timer(
      until,
      ()=>adv(x)
    );

  }

}


/* TIMER */

function timer(until,cb){

  let interval;

  const tick = ()=>{

    const el =
    document.getElementById("timer");

    const left =
    Math.max(
      0,
      until-Date.now()
    );

    const seconds =
    Math.ceil(left/1000);

    const minutes =
    Math.floor(seconds/60);

    const remaining =
    seconds%60;

    if(el){

      el.textContent =
      String(minutes).padStart(2,"0")
      +
      ":"
      +
      String(remaining).padStart(2,"0");

    }

    if(left<=0){

      clearInterval(interval);

      localStorage.removeItem(
        "amaiaPenaltyUntil"
      );

      cb();

    }

  };

  tick();

  interval =
  setInterval(
    tick,
    250
  );

}


/* SUITE */

function adv(x){

  if(x.after){

    card.innerHTML = `

      <div class="center">

        <div class="emoji">
          😏
        </div>

        <h1>
          ${x.after}
        </h1>

        <button
        class="primary"
        onclick="next()">

        Continuer

        </button>

      </div>

    `;

  }

  else{

    next();

  }

}


function next(){

  i++;

  localStorage.setItem(
    "amaiaQuestion",
    i
  );

  if(i < qs.length){

    rq();

  }

  else{

    rev1();

  }

}


/* RÉVÉLATION */

function rev1(){

  localStorage.removeItem(
    "amaiaQuestion"
  );

  card.innerHTML = `

  <div class="center">

    <div class="emoji">
      ❤️
    </div>

    <h1>
      Effectivement… il y avait bien quelque chose derrière tout ça.
    </h1>

    <button
    class="primary"
    onclick="rev2()">

      Découvrir pourquoi ❤️

    </button>

  </div>

  `;

}


function rev2(){

  card.innerHTML = `

  <div class="center">

    <h1>
      Amaïa…
    </h1>

    <p class="muted">

      Pour ton anniversaire,
      je ne voulais pas simplement
      t’offrir quelque chose.

      <br><br>

      Je voulais qu’on vive
      quelque chose tous les deux. ❤️

    </p>

    <button
    class="primary"
    onclick="rev3()">

      Alors… c’est quoi ? 👀

    </button>

  </div>

  `;

}


function rev3(){

  card.innerHTML = `

  <div class="center">

    <h1>
      Prépare ta valise. ✈️
    </h1>

    <p class="muted">

      Du

      <strong>
      8 au 11 décembre 2026
      </strong>

      <br><br>

      on part tous les deux.

    </p>

    <button
    class="primary"
    onclick="rev4()">

      Mais où ? ❤️

    </button>

  </div>

  `;

}


function rev4(){

  card.innerHTML = `

  <div class="center">

    <div class="big">
      🇬🇧 LONDON
    </div>

    <p class="date">
      8 — 11 DÉCEMBRE 2026
    </p>

    <p class="muted">

      Amaïa + Baptiste ❤️

      <br><br>

      Quelques jours rien que tous les deux,
      des marchés de Noël,
      des découvertes
      et surtout de nouveaux souvenirs
      à créer ensemble.

    </p>

    <div class="emoji">
      ❤️ ✨ 🎄
    </div>

  </div>

  `;

}


/* VÉRIFICATION PÉNALITÉ */

const penalty =
Number(
  localStorage.getItem(
    "amaiaPenaltyUntil"
  ) || 0
);


if(
  penalty > Date.now()
){

  card.innerHTML = `

  <div class="center">

    <div class="eyebrow">
      Pénalité en cours 😈
    </div>

    <h1>
      Tu pensais pouvoir tricher en rechargeant ?
    </h1>

    <p class="muted">
      Il reste encore un peu de temps…
    </p>

    <div
    class="timer"
    id="timer">
    </div>

  </div>

  `;

  timer(
    penalty,
    rq
  );

}

else if(
  i > 0 &&
  i < qs.length
){

  rq();

}

else{

  card.innerHTML = `

  <div class="center">

    <div class="emoji">
      🎁
    </div>

    <h1>
      Joyeux anniversaire Amaïa ❤️
    </h1>

    <p class="muted">

      Baptiste a préparé
      un petit quiz.

      Apparemment,
      il y a quelque chose
      à découvrir à la fin…

    </p>

    <button
    class="primary"
    onclick="rq()">

      Commencer le quiz

    </button>

    <div class="tiny">

      Conseil :
      choisis bien tes réponses 😈

    </div>

  </div>

  `;

}

</script>

</body>
</html>
